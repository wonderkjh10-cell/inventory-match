name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: 버전 정보 확인
        id: version
        shell: bash
        run: |
          VERSION=$(cat version.txt | tr -d '\r\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: PyInstaller로 exe 빌드
        run: |
          pyinstaller --onefile --windowed --name "재고매칭" --add-data "version.txt;." 재고매칭.py

      - name: Release 생성 및 exe 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 재고매칭 ${{ steps.version.outputs.version }}
          body: |
            ## 재고매칭 ${{ steps.version.outputs.version }}

            자동 빌드된 실행파일입니다.

            **[재고매칭.exe 다운로드](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/재고매칭.exe)**
          files: dist/재고매칭.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
